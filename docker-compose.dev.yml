services:
  frontend:
    # On remplace l'image construite par un serveur de dev
    build: 
      context: ./frontend
      dockerfile: Dockerfile.dev   # ou on utilise une image node directement
    ports:
      - "5173:5173"   # port par défaut de Vite
    volumes:
      - ./frontend:/app
      - /app/node_modules   # évite d'écraser les modules installés
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - api
    networks:
      - frontend

  api:
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
    command: flask run --host=0.0.0.0 --port=5000
    environment:
      - FLASK_ENV=development
      - FLASK_APP=app:create_app
    # Pas besoin de rebuild à chaque modification

  db:
    image: postgres:15-alpine
    ports:
       - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data_dev:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg_data_dev: