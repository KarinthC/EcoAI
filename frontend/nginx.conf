# Redirection HTTP -> HTTPS (sert aussi au renouvellement Certbot en webroot).
server {
    listen 80;
    server_name ecoai-aifootprint.fr www.ecoai-aifootprint.fr;

    # Challenge ACME : Certbot écrit dans ce dossier, Nginx le sert.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ecoai-aifootprint.fr www.ecoai-aifootprint.fr;

    ssl_certificate     /etc/letsencrypt/live/ecoai-aifootprint.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ecoai-aifootprint.fr/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS : à n'activer qu'une fois le HTTPS validé (difficile à retirer).
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Le JSON d'un pipeline peut dépasser la limite Nginx par défaut (1 Mo).
    client_max_body_size 10m;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Indispensable pour que Flask sache qu'il est derrière HTTPS.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
